<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc">
  <div class="top">
    <h1>Calculator</h1>
    <div class="mode" role="group" aria-label="Angle mode">
      <button id="deg" class="on" type="button">DEG</button>
      <button id="rad" type="button">RAD</button>
    </div>
  </div>
  <div class="screen" aria-live="polite">
    <div class="hist" id="hist"></div>
    <div class="expr" id="expr">0</div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">Keyboard works too: digits, + − * / ^ ( ) ! %, Enter, Backspace, Esc</p>
</main>

<script src="script.js"></script>
</body>
</html>
